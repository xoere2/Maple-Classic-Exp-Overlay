# Runs the overlay's logic tests on every push and pull request. Pull requests from other
# people's copies of the repo get a read-only token and no secrets (GitHub's rule for
# pull_request), so their code can't change anything here.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.10"
      - name: Install the packages (exact files, each checked by its SHA-256)
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Logic tests
        run: python tests/test_logic.py
      - name: Farm analytics tests (fork)
        run: |
          python tests/test_farm.py
          python tests/test_vision.py
          python tests/test_video.py
          python tests/test_perf.py
      - name: Overlay window smoke test (fork)
        run: python tests/test_ui.py
